<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>概念书库</title>
  <meta name="description" content="用概念与方法论读李笑来等书，并汇入开讲同学解读。">
  <script>
  (function () {
    var key = 'concept-lib:theme';
    var theme = 'day';
    try {
      var saved = localStorage.getItem(key);
      if (saved === 'day' || saved === 'night' || saved === 'paper') theme = saved;
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'night';
    } catch (e) {}
    var root = document.documentElement;
    root.setAttribute('data-theme', theme);
    root.style.colorScheme = theme === 'night' ? 'dark' : 'light';
  })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css?v=20261115f">
</head>
<body data-page="home">
  <a class="skip-link" href="#content">跳到内容</a>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="index.html">概念<span>书库</span></a>
      <nav class="site-nav" aria-label="主导航">
        <ul class="nav-links" data-nav-links>
          <li><a href="index.html" class="active" aria-current="page">搜索</a></li>
          <li><a href="books.html">所有书籍</a></li>
          <li><a href="about.html">关于</a></li>
        </ul>
      </nav>
      <div class="theme-switch" role="radiogroup" aria-label="配色" data-theme-switch>
        <button type="button" role="radio" data-theme-choice="day" aria-checked="false">白天</button>
        <button type="button" role="radio" data-theme-choice="night" aria-checked="false">夜间</button>
        <button type="button" role="radio" data-theme-choice="paper" aria-label="护眼暖纸配色" aria-checked="false">护眼</button>
      </div>
    </div>
  </header>

  <main id="content">
    <section class="hero wrap">
      <h1>概念书库</h1>
      <div class="search-box" role="search">
        <div class="search-field">
          <span class="search-hint" id="search-hint"><span class="hint-lead">搜索概念、方法论或原文，</span><span class="hint-examples">例如：财富、时间、定投</span></span>
          <input type="search" data-search-input placeholder=" " aria-labelledby="search-hint">
        </div>
        <button type="button" data-search-btn>搜索</button>
      </div>
      <p class="usage-note">在 25 本书里搜概念、方法论，或开源书里的原话。<br class="note-break">点<span class="keep">结果</span>可打开对应卡片，也可跳到李笑来原站<span class="keep">看上下文</span>。<br class="note-break"><span class="keep">版权书</span>只做书目与摘录，全文请回原站。</p>
      <p class="error-note" data-error></p>
    </section>

    <section class="results wrap">
      <p class="results-meta" data-results-meta></p>
      <div data-results></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">概念书库 · 用概念方法论读书 · 开讲同学共建</div>
  </footer>
  <script src="assets/js/app.js?v=20261115c"></script>
</body>
</html>
