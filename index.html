<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>概念书库</title>
  <meta name="description" content="用概念与方法论读李笑来等书，并汇入开讲同学解读。">
  <link rel="stylesheet" href="assets/css/style.css?v=20261115a">
</head>
<body data-page="home">
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="index.html">概念<span>书库</span></a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-label="菜单">菜单</button>
      <ul class="nav-links" data-nav-links>
        <li><a href="index.html">搜索</a></li>
        <li><a href="books.html">所有书籍</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <h1>概念书库</h1>
      <p class="lead">搜概念、方法论，或书里的原话。结果可打开对应卡片，也可跳到李笑来原站看上下文。版权书只做书目与摘录，全文请回原站。</p>
      <div class="search-box" role="search">
        <input type="search" data-search-input placeholder="搜索概念、方法论或原文，例如：财富、时间、定投" aria-label="搜索">
        <button type="button" data-search-btn>搜索</button>
      </div>

      <div class="hint-card" data-hint>
        <h2>你会搜到什么？</h2>
        <ul>
          <li>25 本书里的关键概念、方法论与模型，点进去会打开对应卡片</li>
          <li>开源书中的原文短摘录，可点「看上下文」跳到李笑来原站</li>
          <li>书名（进入该书的概念页）；本站不收录书籍全文</li>
        </ul>
      </div>
      <p data-error style="color:#b91c1c;margin-top:1rem"></p>
    </section>

    <section class="results wrap">
      <p class="results-meta" data-results-meta></p>
      <div data-results></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">概念书库 · 用概念方法论读书 · 开讲同学共建</div>
  </footer>
  <script src="assets/js/app.js?v=20261115a"></script>
</body>
</html>
